  <rect x="0" y="0" width="1200" height="6" fill="url(#g1)"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  </defs>
  <text x="60" y="52" font-family="'Inter','Noto Sans SC',system-ui,sans-serif" font-size="30" font-weight="800" fill="#e2e8f0">钠电产业化四道关口</text><text x="60" y="80" font-family="'Inter','Noto Sans SC',system-ui,sans-serif" font-size="18" fill="#64748b">2026年关键进展与待突破环节</text>
  <rect x="120" y="120" width="1000" height="76" rx="12" ry="12" fill="#111a2e" stroke="#1e2a44"/><circle cx="160" cy="158" r="22" fill="url(#g1)"/><text x="160" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#06121f">1</text><text x="210" y="154" font-size="20" font-weight="700" fill="#e2e8f0">订单锁定</text><text x="210" y="180" font-size="15" fill="#64748b">2026年4月宁德时代 × 海博思创签署 60GWh 三年钠电长协，全球钠电订单纪录</text><text x="60" y="210" text-anchor="middle" font-size="22" fill="#22d3ee">&#8595;</text><rect x="120" y="216" width="1000" height="76" rx="12" ry="12" fill="#111a2e" stroke="#1e2a44"/><circle cx="160" cy="254" r="22" fill="url(#g1)"/><text x="160" y="262" text-anchor="middle" font-size="20" font-weight="800" fill="#06121f">2</text><text x="210" y="250" font-size="20" font-weight="700" fill="#e2e8f0">产线就绪</text><text x="210" y="276" font-size="15" fill="#64748b">宁德时代钠电专用产线建成投产；亿纬惠州 2GWh 备料；国轩 Q4 规模化量产</text><text x="60" y="306" text-anchor="middle" font-size="22" fill="#22d3ee">&#8595;</text><rect x="120" y="312" width="1000" height="76" rx="12" ry="12" fill="#111a2e" stroke="#1e2a44"/><circle cx="160" cy="350" r="22" fill="url(#g1)"/><text x="160" y="358" text-anchor="middle" font-size="20" font-weight="800" fill="#06121f">3</text><text x="210" y="346" font-size="20" font-weight="700" fill="#e2e8f0">产品交付</text><text x="210" y="372" font-size="15" fill="#64748b">9月海辰发布 N785Ah 电芯 + 4MWh 系统；宁德时代首批钠电系统交付，全年 GWh 级出货</text><text x="60" y="402" text-anchor="middle" font-size="22" fill="#22d3ee">&#8595;</text><rect x="120" y="408" width="1000" height="76" rx="12" ry="12" fill="#111a2e" stroke="#1e2a44"/><circle cx="160" cy="446" r="22" fill="url(#g1)"/><text x="160" y="454" text-anchor="middle" font-size="20" font-weight="800" fill="#06121f">4</text><text x="210" y="442" font-size="20" font-weight="700" fill="#e2e8f0">成本攻关（未完成）</text><text x="210" y="468" font-size="15" fill="#64748b">目标碳酸锂 15 万元/吨时与锂电持平；当前硬碳负极成本偏高、量产良率不足</text>
</svg>