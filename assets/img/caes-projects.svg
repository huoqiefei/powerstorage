<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" font-family="'Inter','Noto Sans SC',system-ui,sans-serif">
  <rect width="1200" height="532" fill="#0a0f1c"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#g1)"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  </defs>
  <text x="60" y="52" font-family="'Inter','Noto Sans SC',system-ui,sans-serif" font-size="30" font-weight="800" fill="#e2e8f0">中国压缩空气储能重大项目</text><text x="60" y="80" font-family="'Inter','Noto Sans SC',system-ui,sans-serif" font-size="18" fill="#64748b">能建 · 中电建 · 中盐等领跑全球 A-CAES</text>
  <rect x="36" y="120" width="546" height="170" rx="14" ry="14" fill="#111a2e" stroke="#1e2a44"/><rect x="36" y="120" width="546" height="6" rx="3" fill="#22d3ee"/><text x="62" y="164" font-size="22" font-weight="800" fill="#e2e8f0">能建·湖北应城</text><text x="62" y="204" font-size="26" font-weight="800" fill="#22d3ee">300MW/1500MWh</text><text x="62" y="240" font-size="15" fill="#64748b">全球首套 300MW 级 A-CAES 投运</text><text x="62" y="268" font-size="13" fill="#9fb3c8">系统效率 70%+（全球最高）</text><rect x="618" y="120" width="546" height="170" rx="14" ry="14" fill="#111a2e" stroke="#1e2a44"/><rect x="618" y="120" width="546" height="6" rx="3" fill="#3b82f6"/><text x="644" y="164" font-size="22" font-weight="800" fill="#e2e8f0">中电建·山东肥城</text><text x="644" y="204" font-size="26" font-weight="800" fill="#3b82f6">5GW 基地</text><text x="644" y="240" font-size="15" fill="#64748b">盐穴储能基地规划，单机 350MW 示范在建</text><text x="644" y="268" font-size="13" fill="#9fb3c8">长时储能基地</text><rect x="36" y="326" width="546" height="170" rx="14" ry="14" fill="#111a2e" stroke="#1e2a44"/><rect x="36" y="326" width="546" height="6" rx="3" fill="#34d399"/><text x="62" y="370" font-size="22" font-weight="800" fill="#e2e8f0">中盐·金坛</text><text x="62" y="410" font-size="26" font-weight="800" fill="#34d399">60MW/300MWh</text><text x="62" y="446" font-size="15" fill="#64748b">国内首个盐穴压缩空气商业项目</text><text x="62" y="474" font-size="13" fill="#9fb3c8">已商业运行</text><rect x="618" y="326" width="546" height="170" rx="14" ry="14" fill="#111a2e" stroke="#1e2a44"/><rect x="618" y="326" width="546" height="6" rx="3" fill="#a78bfa"/><text x="644" y="370" font-size="22" font-weight="800" fill="#e2e8f0">泰安·肥城</text><text x="644" y="410" font-size="26" font-weight="800" fill="#a78bfa">10MW 示范</text><text x="644" y="446" font-size="15" fill="#64748b">压缩空气 + 飞轮混合储能验证</text><text x="644" y="474" font-size="13" fill="#9fb3c8">混合储能</text>
</svg>