  <text x="60" y="52" font-family="'Inter','Noto Sans SC',system-ui,sans-serif" font-size="30" font-weight="800" fill="#e2e8f0">中国储能企业出海区域战略</text><text x="60" y="80" font-family="'Inter','Noto Sans SC',system-ui,sans-serif" font-size="18" fill="#64748b">从产品出口到本地制造的深水区</text>
  <rect x="36" y="120" width="546" height="170" rx="14" ry="14" fill="#111a2e" stroke="#1e2a44"/><rect x="36" y="120" width="546" height="6" rx="3" fill="#22d3ee"/><text x="62" y="164" font-size="22" font-weight="800" fill="#e2e8f0">欧洲</text><text x="62" y="204" font-size="26" font-weight="800" fill="#22d3ee">高壁垒·高价值</text><text x="62" y="240" font-size="15" fill="#64748b">碳关税 + 本土化率要求，系统单价 1.5—2×</text><text x="62" y="268" font-size="13" fill="#9fb3c8">本地建厂趋势</text><rect x="618" y="120" width="546" height="170" rx="14" ry="14" fill="#111a2e" stroke="#1e2a44"/><rect x="618" y="120" width="546" height="6" rx="3" fill="#3b82f6"/><text x="644" y="164" font-size="22" font-weight="800" fill="#e2e8f0">北美</text><text x="644" y="204" font-size="26" font-weight="800" fill="#3b82f6">红利+壁垒</text><text x="644" y="240" font-size="15" fill="#64748b">IRA 税收抵免 30%，UFLPA 溯源严格</text><text x="644" y="268" font-size="13" fill="#9fb3c8">合规是关键</text><rect x="36" y="326" width="546" height="170" rx="14" ry="14" fill="#111a2e" stroke="#1e2a44"/><rect x="36" y="326" width="546" height="6" rx="3" fill="#34d399"/><text x="62" y="370" font-size="22" font-weight="800" fill="#e2e8f0">中东</text><text x="62" y="410" font-size="26" font-weight="800" fill="#34d399">蓝海市场</text><text x="62" y="446" font-size="15" fill="#64748b">沙特 7.8GWh 并网，戈壁大基地激增</text><text x="62" y="474" font-size="13" fill="#9fb3c8">增速最快</text><rect x="618" y="326" width="546" height="170" rx="14" ry="14" fill="#111a2e" stroke="#1e2a44"/><rect x="618" y="326" width="546" height="6" rx="3" fill="#a78bfa"/><text x="644" y="370" font-size="22" font-weight="800" fill="#e2e8f0">亚太</text><text x="644" y="410" font-size="26" font-weight="800" fill="#a78bfa">快速增长</text><text x="644" y="446" font-size="15" fill="#64748b">澳大利亚 / 东南亚加速，本地制造兴起</text><text x="644" y="474" font-size="13" fill="#9fb3c8">潜力巨大</text>
