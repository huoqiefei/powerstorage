  <rect x="120" y="120" width="1000" height="76" rx="12" ry="12" fill="#111a2e" stroke="#1e2a44"/><circle cx="160" cy="158" r="22" fill="url(#g1)"/><text x="160" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#06121f">1</text><text x="210" y="154" font-size="20" font-weight="700" fill="#e2e8f0">峰谷套利</text><text x="210" y="180" font-size="15" fill="#64748b">两充两放，粤浙苏峰谷价差约 0.9 元/kWh</text><text x="60" y="210" text-anchor="middle" font-size="22" fill="#22d3ee">&#8595;</text><rect x="120" y="216" width="1000" height="76" rx="12" ry="12" fill="#111a2e" stroke="#1e2a44"/><circle cx="160" cy="254" r="22" fill="url(#g1)"/><text x="160" y="262" text-anchor="middle" font-size="20" font-weight="800" fill="#06121f">2</text><text x="210" y="250" font-size="20" font-weight="700" fill="#e2e8f0">需量管理</text><text x="210" y="276" font-size="15" fill="#64748b">削减高峰用电，降低基本电费支出</text><text x="60" y="306" text-anchor="middle" font-size="22" fill="#22d3ee">&#8595;</text><rect x="120" y="312" width="1000" height="76" rx="12" ry="12" fill="#111a2e" stroke="#1e2a44"/><circle cx="160" cy="350" r="22" fill="url(#g1)"/><text x="160" y="358" text-anchor="middle" font-size="20" font-weight="800" fill="#06121f">3</text><text x="210" y="346" font-size="20" font-weight="700" fill="#e2e8f0">需求响应</text><text x="210" y="372" font-size="15" fill="#64748b">参与电网邀约削峰，获取单次补贴</text><text x="60" y="402" text-anchor="middle" font-size="22" fill="#22d3ee">&#8595;</text><rect x="120" y="408" width="1000" height="76" rx="12" ry="12" fill="#111a2e" stroke="#1e2a44"/><circle cx="160" cy="446" r="22" fill="url(#g1)"/><text x="160" y="454" text-anchor="middle" font-size="20" font-weight="800" fill="#06121f">4</text><text x="210" y="442" font-size="20" font-weight="700" fill="#e2e8f0">EMS 智能调度</text><text x="210" y="468" font-size="15" fill="#64748b">AI 优化充放电策略，提升 IRR 2—3pct</text>
